<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Запитвания — Геопласт Админ</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1a1a2e}
a{text-decoration:none;color:inherit}
:root{--orange:#ff952b;--navy:#1a1a2e;--green:#38a169;--red:#e53e3e;--white:#fff;--border:#e2e8f0;--gray:#718096}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a1a2e,#2d3561)}
.login-box{background:#fff;border-radius:14px;padding:40px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
.login-box .logo-icon{width:64px;height:64px;background:var(--orange);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#fff;margin:0 auto 16px}
.login-box h2{font-size:22px;font-weight:800;color:var(--navy);margin-bottom:6px}
.login-box p{font-size:13px;color:var(--gray);margin-bottom:24px}
.login-box input{width:100%;border:2px solid var(--border);border-radius:8px;padding:12px 14px;font-size:15px;outline:none;transition:border-color .2s;margin-bottom:12px}
.login-box input:focus{border-color:var(--orange)}
.login-box button{width:100%;background:var(--orange);color:#fff;border:none;border-radius:8px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.login-error{color:var(--red);font-size:13px;margin-top:8px}
.admin-wrap{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--navy);flex-shrink:0;display:flex;flex-direction:column}
.sidebar-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
.sidebar-logo .name{font-size:18px;font-weight:900;color:#fff}
.sidebar-logo .sub{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px}
.sidebar-logo .badge{font-size:10px;background:var(--orange);color:#fff;padding:2px 8px;border-radius:10px;margin-top:6px;display:inline-block}
.sidebar-nav{flex:1;padding:12px 0}
.nav-section{font-size:10px;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:1.5px;padding:14px 20px 6px}
.nav-link{display:flex;align-items:center;gap:10px;padding:11px 20px;font-size:14px;color:rgba(255,255,255,.7);transition:all .15s;border-left:3px solid transparent}
.nav-link:hover,.nav-link.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--orange)}
.nav-link .icon{font-size:16px;width:20px;flex-shrink:0}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1)}
.sidebar-footer a{font-size:12px;color:rgba(255,255,255,.4);display:flex;align-items:center;gap:8px}
.sidebar-footer a:hover{color:#fff}
.main{flex:1;overflow:auto}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar h1{font-size:18px;font-weight:800;color:var(--navy)}
.content{padding:24px 28px}
.stat-bar{display:flex;gap:16px;margin-bottom:20px}
.stat{background:#fff;border-radius:10px;padding:18px 24px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:4px solid var(--orange)}
.stat .val{font-size:28px;font-weight:900;color:var(--navy)}
.stat .lbl{font-size:12px;color:var(--gray);margin-top:2px}
.table-box{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{background:#f8f9fa;padding:10px 16px;text-align:left;font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid #f5f5f5;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}
.empty{text-align:center;color:var(--gray);padding:48px;font-size:14px}
.del-btn{background:none;border:1px solid #e8c4c0;color:var(--red);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
.del-btn:hover{background:#fdf0ef}
.msg-preview{color:#555;font-size:12px;max-width:300px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>

<div class="login-wrap" id="login-screen">
  <div class="login-box">
    <div class="logo-icon">GP</div>
    <h2>Геопласт Админ</h2>
    <p>Въведете паролата за достъп</p>
    <input type="password" id="admin-pass" placeholder="Парола...">
    <button onclick="doLogin()">Влез →</button>
    <div class="login-error" id="login-err"></div>
  </div>
</div>

<div class="admin-wrap" id="admin-panel" style="display:none">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="name">Геопласт</div>
      <div class="sub">Администрация</div>
      <div class="badge">🔧 Admin</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Главно</div>
      <a href="/admin/" class="nav-link"><span class="icon">📊</span> Табло</a>
      <div class="nav-section">Магазин</div>
      <a href="/admin/orders.html" class="nav-link"><span class="icon">📦</span> Поръчки</a>
      <a href="/admin/products.html" class="nav-link"><span class="icon">🔩</span> Продукти</a>
      <div class="nav-section">Клиенти</div>
      <a href="/admin/inquiries.html" class="nav-link active"><span class="icon">📬</span> Запитвания</a>
      <a href="/admin/subscribers.html" class="nav-link"><span class="icon">✉️</span> Абонати</a>
      <div class="nav-section">Настройки</div>
      <a href="/admin/settings.html" class="nav-link"><span class="icon">⚙️</span> Настройки</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/" target="_blank">🌐 Виж магазина</a>
      <a href="#" onclick="doLogout()" style="margin-top:10px">🚪 Изход</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>📬 Запитвания за оферта</h1>
    </div>
    <div class="content">
      <div class="stat-bar">
        <div class="stat">
          <div class="val" id="total-count">—</div>
          <div class="lbl">Общо запитвания</div>
        </div>
      </div>
      <div class="table-box">
        <table>
          <thead><tr><th>#</th><th>Дата</th><th>Клиент</th><th>Телефон / Имейл</th><th>Тема</th><th>Съобщение</th><th></th></tr></thead>
          <tbody id="inq-table"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
let allInq = [];

async function doLogin() {
  const pass = document.getElementById('admin-pass').value;
  const res = await fetch('/api/admin/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: pass }) });
  if (res.ok) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'flex';
    loadInquiries();
  } else {
    document.getElementById('login-err').textContent = 'Грешна парола';
  }
}

async function doLogout() {
  await fetch('/api/admin/logout', { method:'POST' });
  location.reload();
}

async function checkAuth() {
  const res = await fetch('/api/admin/check');
  const data = await res.json();
  if (data.isAdmin) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-panel').style.display = 'flex';
    loadInquiries();
  }
}

async function loadInquiries() {
  const res = await fetch('/api/inquiries');
  allInq = await res.json();
  document.getElementById('total-count').textContent = allInq.length;
  const tbody = document.getElementById('inq-table');
  if (!allInq.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="empty">📭 Няма запитвания все още</td></tr>';
    return;
  }
  tbody.innerHTML = allInq.map((q, i) => `
    <tr>
      <td style="color:var(--gray);font-size:12px">${i + 1}</td>
      <td style="color:var(--gray);white-space:nowrap">${q.created_at ? new Date(q.created_at).toLocaleString('bg-BG', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'}</td>
      <td style="font-weight:700">${esc(q.name)}</td>
      <td>
        <a href="tel:${esc(q.phone)}" style="color:var(--orange);font-weight:600">${esc(q.phone)}</a>
        ${q.email ? `<br><a href="mailto:${esc(q.email)}" style="color:#3182ce;font-size:12px">${esc(q.email)}</a>` : ''}
      </td>
      <td style="font-size:12px;color:#444">${esc(q.subject || '—')}</td>
      <td class="msg-preview">${esc(q.message)}</td>
      <td><button class="del-btn" onclick="deleteInq(${q.id})">🗑 Изтрий</button></td>
    </tr>`).join('');
}

async function deleteInq(id) {
  if (!confirm('Изтрий това запитване?')) return;
  await fetch('/api/inquiries/' + id, { method:'DELETE' });
  loadInquiries();
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('DOMContentLoaded', checkAuth);
document.getElementById('admin-pass')?.addEventListener('keydown', e => e.key === 'Enter' && doLogin());
</script>
</body>
</html>
